# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service runs the API and serves the built React app on the same address.
# The database is MongoDB Atlas (Render has no MongoDB of its own); see "Deploy to Render" in the README.
services:
  - type: web
    name: bookstore
    runtime: node
    plan: free
    # Build the React app, then install the API's production dependencies.
    # Don't set NODE_ENV=production on the service: the frontend build needs its dev dependencies.
    # (`npm start` switches the server itself to production.)
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/bookstore
      - key: DATABASE_URI
        sync: false
      # Comma-separated emails that become admins when they sign up
      - key: ADMIN_EMAILS
        sync: false
      # Random secret for login tokens, generated by Render
      - key: JWT_SECRET
        generateValue: true
      # Render sits behind a proxy; this lets rate limits see each visitor's real IP
      - key: TRUST_PROXY
        value: "1"
