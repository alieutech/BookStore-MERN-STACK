services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:3333
    depends_on:
      - backend
    networks:
      - mern-stack

  backend:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - DATABASE_URI=mongodb://mongo:27017/bookstore
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - mern-stack

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - mern-stack
    volumes:
      - mongo-data:/data/db

networks:
  mern-stack:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  uploads:
    driver: local
